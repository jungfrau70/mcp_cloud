# 개발 환경용 Docker Compose 설정
# 공통 데이터베이스는 docker-compose.base.yml에서 상속

services:
  
  # Backend (개발 환경)
  mcp_backend_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.app
    container_name: mcp_backend_dev
    env_file: 
      - ./backend/env/.env
      - ./.env
    environment:
      - ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql://mcpuser:mcppassword@mcp_postgres:5432/mcp_db
      - REDIS_URL=redis://mcp_redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-sa-key.json
      - CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=/app/gcp-sa-key.json
      - MCP_API_KEY=${MCP_API_KEY:-my_mcp_eagle_tiger}
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - FRONTEND_BASE_URL=http://localhost:3000
      - ALLOW_FORWARDED_AUTH=false
      # HF offline-friendly defaults
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-local}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-jhgan/ko-sroberta-multitask}
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      - HF_LOCAL_FILES_ONLY=${HF_LOCAL_FILES_ONLY:-1}
      - HF_HOME=/cache/hf
      # 파일 감시 설정 개선
      - WATCHFILES_FORCE_POLLING=true
      - WATCHFILES_IGNORE_PATTERNS=*.db,*.db-journal,*.sqlite,*.sqlite-journal
      # Neo4j 연동 환경 변수
      - NEO4J_URI=bolt://mcp_neo4j:7687
      - TEST_MODE=true
      - DISABLE_AUTH=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/tests:/app/tests
      - terraform_modules_data:/app/terraform_modules
      - ./backend/env/alpha-ktixap-43e9bf90eb00.json:/app/gcp-sa-key.json
      - ./mcp_knowledge_base:/mcp_knowledge_base
      - ./.slides_selection.json:/.slides_selection.json
      - hf_cache:/cache/hf
      - azure_config:/root/.azure
      - aws_config:/root/.aws
      - gcloud_config:/root/.config/gcloud
    depends_on:
      mcp_postgres:
        condition: service_healthy
      mcp_redis:
        condition: service_started
      mcp_neo4j:
        condition: service_healthy
    networks:
      - mcp_cloud_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["sh", "-lc", "python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  # Frontend (개발 환경)
  mcp_frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.app
    container_name: mcp_frontend_dev
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NUXT_PUBLIC_WS_BASE_URL=ws://localhost:8000/api
      - NUXT_PUBLIC_API_KEY=${MCP_API_KEY:-my_mcp_eagle_tiger}
      - NODE_ENV=development
      - NUXT_PUBLIC_ENV=development
      - NUXT_PUBLIC_DEBUG=true
      - YARN_PRODUCTION=false
      - NPM_CONFIG_PRODUCTION=false
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - NUXT_TELEMETRY_DISABLED=1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - mcp_backend_dev
    networks:
      - mcp_cloud_network
    command: ["sh", "-lc", "yarn install --frozen-lockfile --production=false || yarn install --production=false && yarn dev"]

  # Celery worker (개발 환경)
  mcp_celery_dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.app
    container_name: mcp_celery_dev
    env_file: ./backend/env/.env
    environment:
      - ENV=development
      - DEBUG=true
      - CELERY_BROKER_URL=redis://mcp_redis:6379/0
      - CELERY_RESULT_BACKEND=redis://mcp_redis:6379/0
      - OTEL_SERVICE_NAME=mcp-backend-dev
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
    volumes:
      - ./backend:/app
      - terraform_modules_data:/app/terraform_modules
      - azure_config:/root/.azure
      - aws_config:/root/.aws
      - gcloud_config:/root/.config/gcloud
    depends_on:
      mcp_redis:
        condition: service_started
      otel-collector:
        condition: service_started
    command: ["sh", "-lc", "python -m celery -A worker.celery_app worker -Q plan,apply,test -c 2 -l info"]
    healthcheck:
      disable: true
    networks:
      - mcp_cloud_network

volumes:
  terraform_modules_data:
  hf_cache:
  azure_config:
  aws_config:
  gcloud_config:
