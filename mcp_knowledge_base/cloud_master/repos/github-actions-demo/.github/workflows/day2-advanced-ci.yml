name: Day2 - Advanced CI/CD with Docker Compose

on:
  push:
    branches: [ day2-advanced ]
  pull_request:
    branches: [ day2-advanced ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run unit tests
      run: npm run test:unit
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379
        
    - name: Run integration tests
      run: npm run test:integration
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        REDIS_URL: redis://localhost:6379
        
    - name: Run linting
      run: npm run lint
      
    - name: Run security audit
      run: npm audit --audit-level moderate
      
  build-matrix:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.multistage]
        environment: [development, staging]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./${{ matrix.dockerfile }}
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:day2-${{ matrix.dockerfile }}-${{ matrix.environment }}-${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:day2-${{ matrix.dockerfile }}-${{ matrix.environment }}-latest
        build-args: |
          NODE_ENV=${{ matrix.environment }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
  docker-compose-test:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker Compose stack
      run: |
        docker-compose -f docker-compose.yml build
        
    - name: Start Docker Compose stack
      run: |
        docker-compose -f docker-compose.yml up -d
        
    - name: Wait for services
      run: |
        sleep 30
        docker-compose -f docker-compose.yml ps
        
    - name: Test application endpoints
      run: |
        curl -f http://localhost:3000/health
        curl -f http://localhost:3000/api/info
        curl -f http://localhost:3000/metrics
        
    - name: Test database connection
      run: |
        docker-compose -f docker-compose.yml exec -T web npm run test:db
        
    - name: Test Redis connection
      run: |
        docker-compose -f docker-compose.yml exec -T web npm run test:redis
        
    - name: Stop Docker Compose stack
      if: always()
      run: |
        docker-compose -f docker-compose.yml down -v
        
  deploy-staging:
    needs: [build-matrix, docker-compose-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/day2-advanced'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
        
    - name: Deploy to AWS ECS
      run: |
        echo "Deploying to AWS ECS staging..."
        # ECS 서비스 업데이트 로직
        aws ecs update-service --cluster staging-cluster --service github-actions-demo --force-new-deployment
        
  deploy-production:
    needs: [build-matrix, docker-compose-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/day2-advanced'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure GCP credentials
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        
    - name: Deploy to GCP Cloud Run
      run: |
        echo "Deploying to GCP Cloud Run production..."
        # Cloud Run 서비스 업데이트 로직
        gcloud run deploy github-actions-demo --image ${{ secrets.DOCKER_USERNAME }}/github-actions-demo:day2-Dockerfile.multistage-production-latest --region us-central1