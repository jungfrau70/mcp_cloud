name: Cleanup Schedule

on:
  schedule:
    # 매일 오전 3시에 정리 실행
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      cleanup_type:
        description: '정리 유형'
        required: true
        default: 'safe'
        type: choice
        options:
        - safe
        - aggressive
        - all

jobs:
  cleanup:
    name: 자동 정리
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 리소스 정리
        if: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x aws-resource-cleanup.sh
          
          case "${{ github.event.inputs.cleanup_type }}" in
            "safe")
              ./aws-resource-cleanup.sh --dry-run
              ;;
            "aggressive")
              ./aws-resource-cleanup.sh --force --exclude-critical
              ;;
            "all")
              ./aws-resource-cleanup.sh --force
              ;;
          esac

      - name: GCP 리소스 정리
        if: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x gcp-project-cleanup.sh
          
          case "${{ github.event.inputs.cleanup_type }}" in
            "safe")
              ./gcp-project-cleanup.sh --dry-run
              ;;
            "aggressive")
              ./gcp-project-cleanup.sh --force --exclude-critical
              ;;
            "all")
              ./gcp-project-cleanup.sh --force
              ;;
          esac

      - name: 정리 로그 생성
        run: |
          mkdir -p cleanup-logs
          echo "자동 정리 실행 완료" > cleanup-logs/cleanup-$(date +%Y%m%d).log
          echo "정리 유형: ${{ github.event.inputs.cleanup_type }}" >> cleanup-logs/cleanup-$(date +%Y%m%d).log
          echo "실행 시간: $(date)" >> cleanup-logs/cleanup-$(date +%Y%m%d).log

      - name: 정리 로그 업로드
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs
          path: cleanup-logs/
