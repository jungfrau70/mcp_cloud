name: Cloud Master CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mcp_knowledge_base/cloud_master/repos/samples/day1/my-app/**'
      - 'mcp_knowledge_base/cloud_master/repos/cloud-scripts/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'aws'
        type: choice
        options:
        - aws
        - gcp
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - build-only
        - cleanup

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_IMAGE_NAME: mcp-cloud-master
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # 1. 환경 체크 및 준비
  environment-check:
    name: Environment Check
    runs-on: ubuntu-latest
    outputs:
      aws-vm-ip: ${{ steps.get-aws-vm.outputs.ip }}
      gcp-vm-ip: ${{ steps.get-gcp-vm.outputs.ip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install boto3 google-cloud-compute

      - name: Get AWS VM IP
        id: get-aws-vm
        if: github.event.inputs.environment == 'aws' || github.event_name == 'push'
        run: |
          python -c "
          import boto3
          import json
          ec2 = boto3.client('ec2', region_name='ap-northeast-2')
          response = ec2.describe_instances(
              Filters=[
                  {'Name': 'tag:Name', 'Values': ['mcp-cloud-master-aws']},
                  {'Name': 'instance-state-name', 'Values': ['running']}
              ]
          )
          if response['Reservations']:
              instance = response['Reservations'][0]['Instances'][0]
              public_ip = instance.get('PublicIpAddress', '')
              print(f'::set-output name=ip::{public_ip}')
          else:
              print('::set-output name=ip::')
          "

      - name: Get GCP VM IP
        id: get-gcp-vm
        if: github.event.inputs.environment == 'gcp' || github.event_name == 'push'
        run: |
          python -c "
          from google.cloud import compute_v1
          import json
          client = compute_v1.InstancesClient()
          project = '${{ secrets.GCP_PROJECT_ID }}'
          zone = 'asia-northeast3-a'
          instance_name = 'mcp-cloud-master-gcp'
          
          try:
              instance = client.get(project=project, zone=zone, instance=instance_name)
              external_ip = instance.network_interfaces[0].access_configs[0].nat_i_p
              print(f'::set-output name=ip::{external_ip}')
          except:
              print('::set-output name=ip::')
          "

  # 2. Docker 이미지 빌드 및 푸시
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: environment-check
    if: github.event.inputs.action != 'cleanup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp_knowledge_base/cloud_master/repos/samples/day1/my-app
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  # 3. AWS VM에 배포
  deploy-aws:
    name: Deploy to AWS VM
    runs-on: ubuntu-latest
    needs: [environment-check, build-and-push]
    if: (github.event.inputs.environment == 'aws' || github.event_name == 'push') && github.event.inputs.action != 'cleanup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS VM
        if: needs.environment-check.outputs.aws-vm-ip != ''
        run: |
          # SSH 키 설정
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > aws-key.pem
          chmod 600 aws-key.pem
          
          # VM에 Docker 이미지 배포
          ssh -i aws-key.pem -o StrictHostKeyChecking=no ubuntu@${{ needs.environment-check.outputs.aws-vm-ip }} << 'EOF'
            # 기존 컨테이너 정리
            docker stop mcp-app || true
            docker rm mcp-app || true
            
            # 새 이미지 풀 및 실행
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            docker run -d \
              --name mcp-app \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            
            # 배포 상태 확인
            docker ps
            curl -f http://localhost:8080/health || echo "Health check failed"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f aws-key.pem

  # 4. GCP VM에 배포
  deploy-gcp:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: [environment-check, build-and-push]
    if: (github.event.inputs.environment == 'gcp' || github.event_name == 'push') && github.event.inputs.action != 'cleanup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to GCP VM
        if: needs.environment-check.outputs.gcp-vm-ip != ''
        run: |
          # SSH 키 설정
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > gcp-key.pem
          chmod 600 gcp-key.pem
          
          # VM에 Docker 이미지 배포
          ssh -i gcp-key.pem -o StrictHostKeyChecking=no ubuntu@${{ needs.environment-check.outputs.gcp-vm-ip }} << 'EOF'
            # 기존 컨테이너 정리
            docker stop mcp-app || true
            docker rm mcp-app || true
            
            # 새 이미지 풀 및 실행
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            docker run -d \
              --name mcp-app \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            
            # 배포 상태 확인
            docker ps
            curl -f http://localhost:8080/health || echo "Health check failed"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f gcp-key.pem

  # 5. 배포 후 테스트
  post-deployment-test:
    name: Post Deployment Test
    runs-on: ubuntu-latest
    needs: [deploy-aws, deploy-gcp]
    if: github.event.inputs.action != 'cleanup'
    steps:
      - name: Test AWS deployment
        if: needs.deploy-aws.result == 'success'
        run: |
          # AWS VM 배포 테스트
          echo "Testing AWS deployment..."
          # 실제 테스트 로직 추가

      - name: Test GCP deployment
        if: needs.deploy-gcp.result == 'success'
        run: |
          # GCP VM 배포 테스트
          echo "Testing GCP deployment..."
          # 실제 테스트 로직 추가

  # 6. 리소스 정리 (수동 트리거)
  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup AWS resources
        if: github.event.inputs.environment == 'aws'
        run: |
          # AWS 리소스 정리 스크립트 실행
          echo "Cleaning up AWS resources..."

      - name: Cleanup GCP resources
        if: github.event.inputs.environment == 'gcp'
        run: |
          # GCP 리소스 정리 스크립트 실행
          echo "Cleaning up GCP resources..."

  # 7. 알림
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-aws, deploy-gcp, post-deployment-test]
    if: always()
    steps:
      - name: Notify Success
        if: needs.build-and-push.result == 'success' && (needs.deploy-aws.result == 'success' || needs.deploy-gcp.result == 'success')
        run: |
          echo "✅ Deployment successful!"
          # Slack, Discord, 이메일 알림 추가 가능

      - name: Notify Failure
        if: needs.build-and-push.result == 'failure' || needs.deploy-aws.result == 'failure' || needs.deploy-gcp.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          # 실패 알림 추가 가능