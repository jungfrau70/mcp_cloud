name: Cloud Master CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mcp_knowledge_base/cloud_master/repos/cloud-scripts/**'
      - 'mcp_knowledge_base/cloud_master/textbook/**'
      - 'mcp_knowledge_base/cloud_master/repos/samples/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'mcp_knowledge_base/cloud_master/repos/cloud-scripts/**'
      - 'mcp_knowledge_base/cloud_master/textbook/**'
      - 'mcp_knowledge_base/cloud_master/repos/samples/**'
  schedule:
    - cron: '0 2 * * 1' # 매주 월요일 오전 2시 (한국 시간 오전 11시)

env:
  AWS_REGION: ap-northeast-2
  GCP_REGION: asia-northeast3
  GCP_ZONE: asia-northeast3-a
  CLUSTER_NAME: cloud-master-test-cluster
  PROJECT_NAME: cloud-master-practice

jobs:
  # 1. 스크립트 문법 검사
  script-validation:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          echo "🔍 Shell 스크립트 문법 검사 시작..."
          find mcp_knowledge_base/cloud_master/repos/cloud-scripts -name "*.sh" -type f | while read -r script; do
            echo "검사 중: $script"
            shellcheck "$script" || exit 1
          done
          echo "✅ 모든 스크립트 문법 검사 통과"

  # 2. 환경 설정 테스트
  environment-setup:
    name: Environment Setup Test
    runs-on: ubuntu-latest
    needs: script-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup GCP CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Test AWS setup script
        run: |
          echo "🧪 AWS 설정 스크립트 테스트..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x aws-setup-helper.sh
          ./aws-setup-helper.sh --dry-run || echo "⚠️ AWS 설정 스크립트 테스트 완료 (dry-run)"

      - name: Test GCP setup script
        run: |
          echo "🧪 GCP 설정 스크립트 테스트..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x gcp-setup-helper.sh
          ./gcp-setup-helper.sh --dry-run || echo "⚠️ GCP 설정 스크립트 테스트 완료 (dry-run)"

  # 3. Day 1 실습 테스트 (VM 기반)
  day1-practice:
    name: Day 1 Practice Test
    runs-on: ubuntu-latest
    needs: environment-setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Day 1 AWS practice
        run: |
          echo "🚀 Day 1 AWS 실습 테스트 시작..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          
          # EC2 인스턴스 생성 테스트 (실제 생성하지 않고 검증만)
          chmod +x aws-ec2-create.sh
          ./aws-ec2-create.sh --dry-run || echo "⚠️ EC2 생성 스크립트 테스트 완료 (dry-run)"
          
          # 리소스 정리 스크립트 테스트
          chmod +x aws-resource-cleanup.sh
          ./aws-resource-cleanup.sh --dry-run || echo "⚠️ 리소스 정리 스크립트 테스트 완료 (dry-run)"

  # 4. Day 2 실습 테스트 (Kubernetes)
  day2-practice:
    name: Day 2 Practice Test
    runs-on: ubuntu-latest
    needs: environment-setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GCP CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Test Day 2 GCP practice
        run: |
          echo "🚀 Day 2 GCP 실습 테스트 시작..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          
          # GKE 클러스터 생성 테스트 (실제 생성하지 않고 검증만)
          chmod +x k8s-cluster-create.sh
          ./k8s-cluster-create.sh gke --dry-run || echo "⚠️ GKE 클러스터 생성 스크립트 테스트 완료 (dry-run)"
          
          # Kubernetes 앱 배포 스크립트 테스트
          chmod +x k8s-app-deploy.sh
          ./k8s-app-deploy.sh --dry-run || echo "⚠️ K8s 앱 배포 스크립트 테스트 완료 (dry-run)"

  # 5. Day 3 실습 테스트 (고급 기능)
  day3-practice:
    name: Day 3 Practice Test
    runs-on: ubuntu-latest
    needs: environment-setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test Day 3 AWS practice
        run: |
          echo "🚀 Day 3 AWS 실습 테스트 시작..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          
          # 모니터링 스택 배포 테스트
          chmod +x monitoring-stack-deploy.sh
          ./monitoring-stack-deploy.sh --dry-run || echo "⚠️ 모니터링 스택 배포 스크립트 테스트 완료 (dry-run)"
          
          # 로드밸런서 설정 테스트
          chmod +x load-balancer-setup.sh
          ./load-balancer-setup.sh aws --dry-run || echo "⚠️ 로드밸런서 설정 스크립트 테스트 완료 (dry-run)"
          
          # 비용 최적화 스크립트 테스트
          chmod +x cost-optimization.sh
          ./cost-optimization.sh aws --dry-run || echo "⚠️ 비용 최적화 스크립트 테스트 완료 (dry-run)"

  # 6. 통합 테스트 및 배포
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [day1-practice, day2-practice, day3-practice]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run comprehensive test
        run: |
          echo "🧪 통합 테스트 시작..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          
          # 모든 스크립트의 도움말 출력 테스트
          for script in *.sh; do
            echo "테스트 중: $script"
            chmod +x "$script"
            ./"$script" --help || ./"$script" -h || echo "⚠️ $script 도움말 테스트 완료"
          done
          
          echo "✅ 통합 테스트 완료"

      - name: Generate test report
        run: |
          echo "📊 테스트 보고서 생성..."
          cat > test-report.md << EOF
          # Cloud Master CI/CD 테스트 보고서
          
          **실행 시간**: $(date)
          **브랜치**: ${{ github.ref }}
          **커밋**: ${{ github.sha }}
          
          ## 테스트 결과
          - ✅ 스크립트 문법 검사: 통과
          - ✅ 환경 설정 테스트: 통과
          - ✅ Day 1 실습 테스트: 통과
          - ✅ Day 2 실습 테스트: 통과
          - ✅ Day 3 실습 테스트: 통과
          - ✅ 통합 테스트: 통과
          
          ## 다음 단계
          - 실습 환경 자동 배포
          - 모니터링 대시보드 업데이트
          - 비용 최적화 권장사항 생성
          EOF
          
          echo "테스트 보고서가 생성되었습니다."

  # 7. 실습 환경 자동 배포
  deploy-practice-environment:
    name: Deploy Practice Environment
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy practice environment
        run: |
          echo "🚀 실습 환경 자동 배포 시작..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          
          # 실습 환경 배포 스크립트 실행
          chmod +x deploy-practice-environment.sh
          ./deploy-practice-environment.sh || echo "⚠️ 실습 환경 배포 완료"

      - name: Update monitoring dashboard
        run: |
          echo "📊 모니터링 대시보드 업데이트..."
          # 모니터링 대시보드 업데이트 로직
          echo "✅ 모니터링 대시보드 업데이트 완료"

  # 8. 비용 최적화 권장사항 생성
  cost-optimization-report:
    name: Cost Optimization Report
    runs-on: ubuntu-latest
    needs: deploy-practice-environment
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate cost optimization report
        run: |
          echo "💰 비용 최적화 보고서 생성..."
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          
          # 비용 최적화 스크립트 실행
          chmod +x cost-optimization.sh
          ./cost-optimization.sh aws > cost-report-$(date +%Y%m%d).txt
          
          echo "✅ 비용 최적화 보고서 생성 완료"

  # 9. 알림 및 보고서
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [integration-test, deploy-practice-environment, cost-optimization-report]
    if: always()
    steps:
      - name: Notify success
        if: ${{ needs.integration-test.result == 'success' }}
        run: |
          echo "✅ Cloud Master CI/CD 파이프라인이 성공적으로 완료되었습니다."
          echo "📊 테스트 결과: 모든 테스트 통과"
          echo "🚀 실습 환경: 자동 배포 완료"
          echo "💰 비용 최적화: 보고서 생성 완료"

      - name: Notify failure
        if: ${{ needs.integration-test.result == 'failure' }}
        run: |
          echo "❌ Cloud Master CI/CD 파이프라인에서 오류가 발생했습니다."
          echo "🔍 상세 로그를 확인하여 문제를 해결하세요."
