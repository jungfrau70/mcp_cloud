name: Cloud Master CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: '클라우드 프로바이더 선택'
        required: true
        default: 'aws'
        type: choice
        options:
        - aws
        - gcp
        - both
      skill_level:
        description: '실습 난이도'
        required: true
        default: '중급'
        type: choice
        options:
        - 초급
        - 중급
        - 고급
      budget_limit:
        description: '예산 한도 (USD)'
        required: false
        default: '50'
        type: string
  schedule:
    # 매일 오전 9시에 정기 정리 실행
    - cron: '0 9 * * *'
  push:
    branches: [ main, develop ]
    paths:
      - 'mcp_knowledge_base/cloud_master/repos/cloud-scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'mcp_knowledge_base/cloud_master/repos/cloud-scripts/**'

env:
  AWS_REGION: us-west-2
  GCP_REGION: us-central1
  GCP_ZONE: us-central1-a
  BUDGET_LIMIT: ${{ github.event.inputs.budget_limit || '50' }}
  SKILL_LEVEL: ${{ github.event.inputs.skill_level || '중급' }}

jobs:
  # 1. 환경 검증
  environment-check:
    name: 환경 검증
    runs-on: ubuntu-latest
    outputs:
      environment-ok: ${{ steps.check.outputs.environment-ok }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: WSL 환경 시뮬레이션
        run: |
          echo "WSL 환경 시뮬레이션 시작"
          # WSL 환경에서 실행되는 것처럼 시뮬레이션
          export WSL_DISTRO_NAME="Ubuntu"
          export WSLENV="PATH"

      - name: 필수 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            wget \
            git \
            unzip \
            jq \
            awscli \
            google-cloud-cli \
            docker.io \
            kubectl \
            helm \
            terraform

      - name: 환경 체크 스크립트 실행
        id: check
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x environment-check-wsl.sh
          if ./environment-check-wsl.sh; then
            echo "environment-ok=true" >> $GITHUB_OUTPUT
          else
            echo "environment-ok=false" >> $GITHUB_OUTPUT
          fi

  # 2. AWS 인프라 자동화
  aws-infrastructure:
    name: AWS 인프라 자동화
    runs-on: ubuntu-latest
    needs: environment-check
    if: ${{ needs.environment-check.outputs.environment-ok == 'true' && (github.event.inputs.cloud_provider == 'aws' || github.event.inputs.cloud_provider == 'both') }}
    environment: aws-production
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AWS 환경 설정
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x aws-setup-helper.sh
          ./aws-setup-helper.sh

      - name: AWS EC2 인스턴스 생성
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x aws-ec2-create.sh
          ./aws-ec2-create.sh --skill-level ${{ env.SKILL_LEVEL }} --budget ${{ env.BUDGET_LIMIT }}

      - name: AWS 리소스 상태 확인
        run: |
          aws ec2 describe-instances --query 'Reservations[*].Instances[*].[InstanceId,State.Name,PublicIpAddress]' --output table

  # 3. GCP 인프라 자동화
  gcp-infrastructure:
    name: GCP 인프라 자동화
    runs-on: ubuntu-latest
    needs: environment-check
    if: ${{ needs.environment-check.outputs.environment-ok == 'true' && (github.event.inputs.cloud_provider == 'gcp' || github.event.inputs.cloud_provider == 'both') }}
    environment: gcp-production
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: GCP 자격증명 설정
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: GCP 환경 설정
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x gcp-setup-helper.sh
          ./gcp-setup-helper.sh

      - name: GCP Compute Engine 인스턴스 생성
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x gcp-compute-create.sh
          ./gcp-compute-create.sh --skill-level ${{ env.SKILL_LEVEL }} --budget ${{ env.BUDGET_LIMIT }}

      - name: GCP 리소스 상태 확인
        run: |
          gcloud compute instances list --format="table(name,zone,machineType,status)"

  # 4. Kubernetes 클러스터 자동화
  kubernetes-deployment:
    name: Kubernetes 클러스터 자동화
    runs-on: ubuntu-latest
    needs: [aws-infrastructure, gcp-infrastructure]
    if: always() && (needs.aws-infrastructure.result == 'success' || needs.gcp-infrastructure.result == 'success')
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS EKS 클러스터 생성 (AWS 선택시)
        if: ${{ github.event.inputs.cloud_provider == 'aws' || github.event.inputs.cloud_provider == 'both' }}
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x k8s-cluster-create.sh
          ./k8s-cluster-create.sh --provider aws --skill-level ${{ env.SKILL_LEVEL }}

      - name: GCP GKE 클러스터 생성 (GCP 선택시)
        if: ${{ github.event.inputs.cloud_provider == 'gcp' || github.event.inputs.cloud_provider == 'both' }}
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x k8s-cluster-create.sh
          ./k8s-cluster-create.sh --provider gcp --skill-level ${{ env.SKILL_LEVEL }}

      - name: Kubernetes 애플리케이션 배포
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x k8s-app-deploy.sh
          ./k8s-app-deploy.sh --skill-level ${{ env.SKILL_LEVEL }}

  # 5. 모니터링 및 로깅 설정
  monitoring-setup:
    name: 모니터링 및 로깅 설정
    runs-on: ubuntu-latest
    needs: kubernetes-deployment
    if: always() && needs.kubernetes-deployment.result == 'success'
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 모니터링 스택 배포
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x monitoring-stack-deploy.sh
          ./monitoring-stack-deploy.sh --skill-level ${{ env.SKILL_LEVEL }}

      - name: 로드밸런서 설정
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x load-balancer-setup.sh
          ./load-balancer-setup.sh --skill-level ${{ env.SKILL_LEVEL }}

  # 6. 보안 스캔
  security-scan:
    name: 보안 스캔
    runs-on: ubuntu-latest
    needs: [aws-infrastructure, gcp-infrastructure]
    if: always() && (needs.aws-infrastructure.result == 'success' || needs.gcp-infrastructure.result == 'success')
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 보안 스캔
        if: ${{ github.event.inputs.cloud_provider == 'aws' || github.event.inputs.cloud_provider == 'both' }}
        run: |
          # AWS Inspector 스캔 실행
          aws inspector start-assessment-run --assessment-template-arn arn:aws:inspector:us-west-2:123456789012:target/0-XXXXXXXXX/template/0-XXXXXXXXX

      - name: GCP 보안 스캔
        if: ${{ github.event.inputs.cloud_provider == 'gcp' || github.event.inputs.cloud_provider == 'both' }}
        run: |
          # GCP Security Command Center 스캔 실행
          gcloud scc sources list

  # 7. 비용 최적화
  cost-optimization:
    name: 비용 최적화
    runs-on: ubuntu-latest
    needs: [aws-infrastructure, gcp-infrastructure]
    if: always() && (needs.aws-infrastructure.result == 'success' || needs.gcp-infrastructure.result == 'success')
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 비용 최적화 분석
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x cost-optimization.sh
          ./cost-optimization.sh --budget-limit ${{ env.BUDGET_LIMIT }}

      - name: 비용 보고서 생성
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x advanced-cost-optimization.sh
          ./advanced-cost-optimization.sh --report-only

  # 8. 알림 및 보고서
  notification:
    name: 알림 및 보고서
    runs-on: ubuntu-latest
    needs: [aws-infrastructure, gcp-infrastructure, kubernetes-deployment, monitoring-setup, security-scan, cost-optimization]
    if: always()
    steps:
      - name: Slack 알림 전송
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#cloud-master'
          text: |
            Cloud Master CI/CD 파이프라인 완료
            - 클라우드 프로바이더: ${{ github.event.inputs.cloud_provider }}
            - 실습 난이도: ${{ env.SKILL_LEVEL }}
            - 예산 한도: ${{ env.BUDGET_LIMIT }} USD
            - 상태: ${{ job.status }}

      - name: 이메일 알림 전송
        if: ${{ secrets.EMAIL_NOTIFICATION }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Cloud Master CI/CD 파이프라인 완료
          to: ${{ secrets.EMAIL_NOTIFICATION }}
          from: GitHub Actions
          body: |
            Cloud Master CI/CD 파이프라인이 완료되었습니다.
            
            결과:
            - AWS 인프라: ${{ needs.aws-infrastructure.result }}
            - GCP 인프라: ${{ needs.gcp-infrastructure.result }}
            - Kubernetes: ${{ needs.kubernetes-deployment.result }}
            - 모니터링: ${{ needs.monitoring-setup.result }}
            - 보안 스캔: ${{ needs.security-scan.result }}
            - 비용 최적화: ${{ needs.cost-optimization.result }}

  # 9. 자동 정리 (스케줄 실행시)
  cleanup:
    name: 자동 정리
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 리소스 정리
        if: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x aws-resource-cleanup.sh
          ./aws-resource-cleanup.sh --force

      - name: GCP 리소스 정리
        if: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          cd mcp_knowledge_base/cloud_master/repos/cloud-scripts
          chmod +x gcp-project-cleanup.sh
          ./gcp-project-cleanup.sh --force