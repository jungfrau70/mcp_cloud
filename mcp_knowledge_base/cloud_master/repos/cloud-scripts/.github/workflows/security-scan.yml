name: Security Scan

on:
  schedule:
    # 매주 월요일 오전 2시에 보안 스캔 실행
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      scan_type:
        description: '스캔 유형'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - quick
        - compliance

jobs:
  security-scan:
    name: 보안 스캔
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 보안 스캔
        if: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          # AWS Inspector 스캔
          aws inspector describe-assessment-templates
          
          # AWS Config 규칙 확인
          aws configservice describe-config-rules
          
          # AWS GuardDuty 결과 확인
          aws guardduty list-findings --detector-id $(aws guardduty list-detectors --query 'DetectorIds[0]' --output text)

      - name: GCP 보안 스캔
        if: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          # GCP Security Command Center 스캔
          gcloud scc sources list
          
          # GCP Asset Inventory 스캔
          gcloud asset search-all-resources --scope=organizations/$(gcloud organizations list --format="value(name)")

      - name: 컨테이너 보안 스캔
        run: |
          # Trivy를 사용한 컨테이너 이미지 스캔
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --severity HIGH,CRITICAL \
            mcp_knowledge_base/cloud_master/repos/cloud-scripts

      - name: 인프라 코드 보안 스캔
        run: |
          # Checkov를 사용한 Terraform 코드 스캔
          pip install checkov
          checkov -d mcp_knowledge_base/cloud_master/repos/cloud-scripts --framework terraform

      - name: 보안 스캔 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: security-scan-results/
