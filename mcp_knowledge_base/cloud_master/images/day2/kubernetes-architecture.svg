<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="600" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    Kubernetes Cluster Architecture
  </text>
  
  <!-- Master Node -->
  <rect x="50" y="60" width="200" height="200" fill="#0891b2" stroke="#0e7490" stroke-width="3" rx="12"/>
  <text x="150" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Master Node (Control Plane)
  </text>
  
  <!-- API Server -->
  <rect x="70" y="100" width="160" height="40" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="6"/>
  <text x="150" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    API Server
  </text>
  
  <!-- etcd -->
  <rect x="70" y="150" width="160" height="40" fill="#059669" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="150" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    etcd
  </text>
  
  <!-- Scheduler -->
  <rect x="70" y="200" width="75" height="40" fill="#7c3aed" stroke="#6d28d9" stroke-width="2" rx="6"/>
  <text x="107" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    Scheduler
  </text>
  
  <!-- Controller Manager -->
  <rect x="155" y="200" width="75" height="40" fill="#dc2626" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="192" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    Controller
  </text>
  <text x="192" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Manager
  </text>
  
  <!-- Worker Node 1 -->
  <rect x="300" y="60" width="180" height="200" fill="#f59e0b" stroke="#d97706" stroke-width="3" rx="12"/>
  <text x="390" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Worker Node 1
  </text>
  
  <!-- kubelet -->
  <rect x="320" y="100" width="140" height="30" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="6"/>
  <text x="390" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    kubelet
  </text>
  
  <!-- kube-proxy -->
  <rect x="320" y="140" width="140" height="30" fill="#059669" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="390" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    kube-proxy
  </text>
  
  <!-- Container Runtime -->
  <rect x="320" y="180" width="140" height="30" fill="#7c3aed" stroke="#6d28d9" stroke-width="2" rx="6"/>
  <text x="390" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Container Runtime
  </text>
  
  <!-- Pods -->
  <rect x="330" y="220" width="50" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="355" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">
    Pod 1
  </text>
  
  <rect x="390" y="220" width="50" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="415" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">
    Pod 2
  </text>
  
  <!-- Worker Node 2 -->
  <rect x="520" y="60" width="180" height="200" fill="#f59e0b" stroke="#d97706" stroke-width="3" rx="12"/>
  <text x="610" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Worker Node 2
  </text>
  
  <!-- kubelet -->
  <rect x="540" y="100" width="140" height="30" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="6"/>
  <text x="610" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    kubelet
  </text>
  
  <!-- kube-proxy -->
  <rect x="540" y="140" width="140" height="30" fill="#059669" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="610" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    kube-proxy
  </text>
  
  <!-- Container Runtime -->
  <rect x="540" y="180" width="140" height="30" fill="#7c3aed" stroke="#6d28d9" stroke-width="2" rx="6"/>
  <text x="610" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">
    Container Runtime
  </text>
  
  <!-- Pods -->
  <rect x="550" y="220" width="50" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="575" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">
    Pod 3
  </text>
  
  <rect x="610" y="220" width="50" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="635" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#15803d">
    Pod 4
  </text>
  
  <!-- Worker Node 3 -->
  <rect x="740" y="60" width="120" height="200" fill="#f59e0b" stroke="#d97706" stroke-width="3" rx="12"/>
  <text x="800" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Worker Node 3
  </text>
  
  <!-- kubelet -->
  <rect x="760" y="100" width="80" height="30" fill="#3b82f6" stroke="#1e40af" stroke-width="2" rx="6"/>
  <text x="800" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    kubelet
  </text>
  
  <!-- kube-proxy -->
  <rect x="760" y="140" width="80" height="30" fill="#059669" stroke="#047857" stroke-width="2" rx="6"/>
  <text x="800" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">
    kube-proxy
  </text>
  
  <!-- Container Runtime -->
  <rect x="760" y="180" width="80" height="30" fill="#7c3aed" stroke="#6d28d9" stroke-width="2" rx="6"/>
  <text x="800" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">
    Container
  </text>
  <text x="800" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">
    Runtime
  </text>
  
  <!-- Pods -->
  <rect x="770" y="220" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1" rx="4"/>
  <text x="790" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#15803d">
    Pod 5
  </text>
  
  <!-- Communication Lines -->
  <path d="M 250 160 L 300 160" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 160 L 300 160" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
  
  <path d="M 250 160 L 300 160" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 250 160 L 300 160" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
  
  <path d="M 480 160 L 520 160" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 480 160 L 520 160" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
  
  <path d="M 700 160 L 740 160" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 700 160 L 740 160" stroke="#374151" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Kubernetes Resources -->
  <text x="450" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">
    Kubernetes Resources
  </text>
  
  <!-- Pod -->
  <rect x="50" y="350" width="100" height="80" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="100" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#15803d">
    Pod
  </text>
  <text x="100" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">
    Smallest deployable
  </text>
  <text x="100" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">
    unit
  </text>
  <text x="100" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">
    1+ containers
  </text>
  
  <!-- Deployment -->
  <rect x="180" y="350" width="100" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="230" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">
    Deployment
  </text>
  <text x="230" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
    Manages Pods
  </text>
  <text x="230" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
    Rolling updates
  </text>
  <text x="230" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
    Scaling
  </text>
  
  <!-- Service -->
  <rect x="310" y="350" width="100" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="360" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">
    Service
  </text>
  <text x="360" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
    Network endpoint
  </text>
  <text x="360" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
    Load balancing
  </text>
  <text x="360" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
    Service discovery
  </text>
  
  <!-- ConfigMap -->
  <rect x="440" y="350" width="100" height="80" fill="#fce7f3" stroke="#ec4899" stroke-width="2" rx="8"/>
  <text x="490" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#be185d">
    ConfigMap
  </text>
  <text x="490" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d">
    Configuration
  </text>
  <text x="490" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d">
    data storage
  </text>
  <text x="490" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d">
    Key-value pairs
  </text>
  
  <!-- Secret -->
  <rect x="570" y="350" width="100" height="80" fill="#fecaca" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="620" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">
    Secret
  </text>
  <text x="620" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
    Sensitive data
  </text>
  <text x="620" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
    Passwords, tokens
  </text>
  <text x="620" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
    Encrypted
  </text>
  
  <!-- Namespace -->
  <rect x="700" y="350" width="100" height="80" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="750" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4338ca">
    Namespace
  </text>
  <text x="750" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">
    Resource isolation
  </text>
  <text x="750" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">
    Virtual clusters
  </text>
  <text x="750" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">
    Multi-tenancy
  </text>
  
  <!-- Resource Relationships -->
  <text x="450" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
    Resource Relationships
  </text>
  
  <!-- Relationship Arrows -->
  <path d="M 100 430 L 180 430" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 230 430 L 310 430" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 360 430 L 440 430" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 490 430 L 570 430" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 620 430 L 700 430" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Labels -->
  <text x="140" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">manages</text>
  <text x="270" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">exposes</text>
  <text x="400" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">configures</text>
  <text x="530" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">secures</text>
  <text x="660" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">isolates</text>
  
  <!-- kubectl Commands -->
  <rect x="50" y="520" width="800" height="60" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="450" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">
    Essential kubectl Commands
  </text>
  
  <text x="100" y="565" font-family="Arial, sans-serif" font-size="11" fill="#374151">kubectl get pods</text>
  <text x="200" y="565" font-family="Arial, sans-serif" font-size="11" fill="#374151">kubectl create deployment</text>
  <text x="350" y="565" font-family="Arial, sans-serif" font-size="11" fill="#374151">kubectl expose service</text>
  <text x="500" y="565" font-family="Arial, sans-serif" font-size="11" fill="#374151">kubectl scale deployment</text>
  <text x="650" y="565" font-family="Arial, sans-serif" font-size="11" fill="#374151">kubectl logs</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
</svg>
