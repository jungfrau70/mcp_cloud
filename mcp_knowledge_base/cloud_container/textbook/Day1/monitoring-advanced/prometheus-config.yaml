apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: container-demo
  labels:
    app: prometheus
    component: server
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'container-demo-cluster'
        environment: 'production'
    
    rule_files:
      - "rules/*.yml"
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093
    
    scrape_configs:
    # Kubernetes API server
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
    
    # Kubernetes nodes
    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics
    
    # Kubernetes pods
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
    
    # Container Demo application
    - job_name: 'container-demo'
      static_configs:
      - targets: ['container-demo-service:80']
      metrics_path: /metrics
      scrape_interval: 5s
      scrape_timeout: 3s
      relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: container-demo
    
    # MySQL metrics
    - job_name: 'mysql'
      static_configs:
      - targets: ['mysql-service:3306']
      metrics_path: /metrics
      scrape_interval: 15s
    
    # Redis metrics
    - job_name: 'redis'
      static_configs:
      - targets: ['redis-service:6379']
      metrics_path: /metrics
      scrape_interval: 15s

  # Alert rules
  rules/container-demo-alerts.yml: |
    groups:
    - name: container-demo
      rules:
      - alert: ContainerDemoDown
        expr: up{job="container-demo"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container Demo application is down"
          description: "Container Demo application has been down for more than 1 minute"
      
      - alert: ContainerDemoHighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container Demo high error rate"
          description: "Container Demo error rate is {{ $value }} errors per second"
      
      - alert: ContainerDemoHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Container Demo high response time"
          description: "Container Demo 95th percentile response time is {{ $value }} seconds"
      
      - alert: ContainerDemoHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container Demo high CPU usage"
          description: "Container Demo CPU usage is {{ $value }}%"
      
      - alert: ContainerDemoHighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container Demo high memory usage"
          description: "Container Demo memory usage is {{ $value }}%"
