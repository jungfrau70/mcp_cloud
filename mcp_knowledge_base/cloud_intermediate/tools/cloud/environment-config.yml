# =============================================================================
# Cloud Intermediate 환경 설정 표준화
# =============================================================================
# 
# 기능:
#   - 모든 실습에서 공통으로 사용하는 환경 설정
#   - 환경별 설정 분리 (development, staging, production)
#   - 의존성 관리 및 버전 통제
#
# 사용법:
#   yq eval '.development' environment-config.yml
#
# 작성일: 2024-12-19
# 작성자: Cloud Intermediate 과정
# =============================================================================

# =============================================================================
# 환경별 설정
# =============================================================================
environments:
  development:
    # 기본 설정
    name: "Cloud Intermediate Development"
    description: "개발 환경 설정"
    
    # 클라우드 설정
    aws:
      region: "ap-northeast-2"
      profile: "default"
      instance_type: "t3.medium"
      key_pair: "cloud-intermediate-key"
      
    gcp:
      region: "asia-northeast3"
      zone: "asia-northeast3-a"
      machine_type: "e2-medium"
      project_id: "cloud-intermediate-dev"
      
    # Docker 설정
    docker:
      registry: "docker.io"
      namespace: "cloud-intermediate"
      tag: "dev"
      
    # Kubernetes 설정
    kubernetes:
      version: "1.28"
      cluster_name: "cloud-intermediate-dev"
      node_count: 2
      
    # 모니터링 설정
    monitoring:
      prometheus:
        port: 9090
        retention: "15d"
      grafana:
        port: 3000
        admin_password: "admin123"
        
    # 로깅 설정
    logging:
      level: "DEBUG"
      retention: "7d"
      
  staging:
    # 기본 설정
    name: "Cloud Intermediate Staging"
    description: "스테이징 환경 설정"
    
    # 클라우드 설정
    aws:
      region: "ap-northeast-2"
      profile: "staging"
      instance_type: "t3.large"
      key_pair: "cloud-intermediate-staging-key"
      
    gcp:
      region: "asia-northeast3"
      zone: "asia-northeast3-a"
      machine_type: "e2-standard-2"
      project_id: "cloud-intermediate-staging"
      
    # Docker 설정
    docker:
      registry: "gcr.io"
      namespace: "cloud-intermediate-staging"
      tag: "staging"
      
    # Kubernetes 설정
    kubernetes:
      version: "1.28"
      cluster_name: "cloud-intermediate-staging"
      node_count: 3
      
    # 모니터링 설정
    monitoring:
      prometheus:
        port: 9090
        retention: "30d"
      grafana:
        port: 3000
        admin_password: "staging123"
        
    # 로깅 설정
    logging:
      level: "INFO"
      retention: "30d"
      
  production:
    # 기본 설정
    name: "Cloud Intermediate Production"
    description: "프로덕션 환경 설정"
    
    # 클라우드 설정
    aws:
      region: "us-west-2"
      profile: "production"
      instance_type: "t3.xlarge"
      key_pair: "cloud-intermediate-prod-key"
      
    gcp:
      region: "us-central1"
      zone: "us-central1-a"
      machine_type: "e2-standard-4"
      project_id: "cloud-intermediate-prod"
      
    # Docker 설정
    docker:
      registry: "gcr.io"
      namespace: "cloud-intermediate-prod"
      tag: "latest"
      
    # Kubernetes 설정
    kubernetes:
      version: "1.28"
      cluster_name: "cloud-intermediate-prod"
      node_count: 5
      
    # 모니터링 설정
    monitoring:
      prometheus:
        port: 9090
        retention: "90d"
      grafana:
        port: 3000
        admin_password: "prod123"
        
    # 로깅 설정
    logging:
      level: "WARN"
      retention: "90d"

# =============================================================================
# 공통 설정
# =============================================================================
common:
  # 프로젝트 정보
  project:
    name: "Cloud Intermediate"
    version: "2.0.0"
    description: "클라우드 중급 과정 자동화 시스템"
    
  # 필수 도구 버전
  tools:
    docker:
      min_version: "24.0.0"
      recommended_version: "24.0.0"
    kubectl:
      min_version: "1.28.0"
      recommended_version: "1.28.0"
    aws_cli:
      min_version: "2.13.0"
      recommended_version: "2.13.0"
    gcloud:
      min_version: "450.0.0"
      recommended_version: "450.0.0"
      
  # 네트워크 설정
  network:
    ports:
      prometheus: 9090
      grafana: 3000
      nginx: 80
      app: 3000
      
  # 보안 설정
  security:
    ssl:
      enabled: false
      cert_path: "/etc/ssl/certs"
      key_path: "/etc/ssl/private"
    firewall:
      enabled: true
      allowed_ports: [22, 80, 443, 3000, 9090]
      
  # 백업 설정
  backup:
    enabled: true
    schedule: "0 2 * * *"  # 매일 오전 2시
    retention: "30d"
    location: "s3://cloud-intermediate-backups"

# =============================================================================
# 실습별 설정
# =============================================================================
practices:
  docker_advanced:
    name: "Docker 고급 실습"
    duration: "90분"
    difficulty: "중급"
    prerequisites: ["Docker 기초"]
    resources:
      cpu: "2"
      memory: "4Gi"
      storage: "20Gi"
      
  kubernetes_basics:
    name: "Kubernetes 기초 실습"
    duration: "120분"
    difficulty: "중급"
    prerequisites: ["Docker 기초", "Kubernetes 개념"]
    resources:
      cpu: "4"
      memory: "8Gi"
      storage: "50Gi"
      
  cloud_container_services:
    name: "클라우드 컨테이너 서비스 실습"
    duration: "90분"
    difficulty: "중급"
    prerequisites: ["Docker 기초", "AWS/GCP 계정"]
    resources:
      cpu: "2"
      memory: "4Gi"
      storage: "30Gi"
      
  monitoring_hub:
    name: "통합 모니터링 허브 구축"
    duration: "90분"
    difficulty: "고급"
    prerequisites: ["Docker 기초", "Prometheus/Grafana 개념"]
    resources:
      cpu: "4"
      memory: "8Gi"
      storage: "100Gi"
      
  cicd_pipeline:
    name: "GitHub Actions CI/CD 파이프라인"
    duration: "90분"
    difficulty: "고급"
    prerequisites: ["Git 기초", "GitHub Actions 개념"]
    resources:
      cpu: "2"
      memory: "4Gi"
      storage: "20Gi"
      
  advanced_monitoring:
    name: "멀티 클라우드 통합 모니터링"
    duration: "120분"
    difficulty: "고급"
    prerequisites: ["Kubernetes 기초", "모니터링 개념"]
    resources:
      cpu: "8"
      memory: "16Gi"
      storage: "200Gi"
