<svg width="900" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="400" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">
    CI/CD Pipeline Flow
  </text>
  
  <!-- Developer -->
  <circle cx="100" cy="100" r="40" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/>
  <text x="100" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Developer
  </text>
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Code
  </text>
  
  <!-- Git Repository -->
  <rect x="200" y="60" width="120" height="80" fill="#059669" stroke="#047857" stroke-width="2" rx="8"/>
  <text x="260" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Git Repository
  </text>
  <text x="260" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    (GitHub)
  </text>
  <text x="260" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Push/PR
  </text>
  
  <!-- GitHub Actions -->
  <rect x="380" y="60" width="140" height="80" fill="#7c3aed" stroke="#6d28d9" stroke-width="2" rx="8"/>
  <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    GitHub Actions
  </text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    CI/CD Pipeline
  </text>
  <text x="450" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    Automated
  </text>
  
  <!-- Build Stage -->
  <rect x="580" y="60" width="100" height="80" fill="#f59e0b" stroke="#d97706" stroke-width="2" rx="8"/>
  <text x="630" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Build
  </text>
  <text x="630" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Docker Image
  </text>
  <text x="630" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Test
  </text>
  
  <!-- Deploy Stage -->
  <rect x="720" y="60" width="100" height="80" fill="#dc2626" stroke="#b91c1c" stroke-width="2" rx="8"/>
  <text x="770" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    Deploy
  </text>
  <text x="770" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    Production
  </text>
  <text x="770" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">
    VM/Cloud
  </text>
  
  <!-- Arrows -->
  <path d="M 140 100 L 200 100" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 320 100 L 380 100" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 520 100 L 580 100" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 680 100 L 720 100" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Detailed Pipeline Steps -->
  <text x="450" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
    Detailed Pipeline Steps
  </text>
  
  <!-- Step 1: Code Push -->
  <rect x="50" y="200" width="120" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="110" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">
    1. Code Push
  </text>
  <text x="110" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
    git push origin main
  </text>
  <text x="110" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">
    Triggers workflow
  </text>
  
  <!-- Step 2: Checkout -->
  <rect x="200" y="200" width="120" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="8"/>
  <text x="260" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d">
    2. Checkout
  </text>
  <text x="260" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">
    actions/checkout@v3
  </text>
  <text x="260" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">
    Get source code
  </text>
  
  <!-- Step 3: Setup -->
  <rect x="350" y="200" width="120" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="410" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">
    3. Setup
  </text>
  <text x="410" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
    Node.js, Docker
  </text>
  <text x="410" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">
    Environment
  </text>
  
  <!-- Step 4: Test -->
  <rect x="500" y="200" width="120" height="60" fill="#fce7f3" stroke="#ec4899" stroke-width="2" rx="8"/>
  <text x="560" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#be185d">
    4. Test
  </text>
  <text x="560" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d">
    Unit Tests
  </text>
  <text x="560" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#be185d">
    Linting
  </text>
  
  <!-- Step 5: Build -->
  <rect x="650" y="200" width="120" height="60" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="8"/>
  <text x="710" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4338ca">
    5. Build
  </text>
  <text x="710" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">
    Docker Image
  </text>
  <text x="710" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4338ca">
    Push to Registry
  </text>
  
  <!-- Step 6: Deploy -->
  <rect x="800" y="200" width="120" height="60" fill="#fecaca" stroke="#ef4444" stroke-width="2" rx="8"/>
  <text x="860" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">
    6. Deploy
  </text>
  <text x="860" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
    AWS/GCP
  </text>
  <text x="860" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">
    Production
  </text>
  
  <!-- Step Arrows -->
  <path d="M 170 230 L 200 230" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 320 230 L 350 230" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 470 230 L 500 230" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 620 230 L 650 230" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 770 230 L 800 230" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Benefits -->
  <rect x="50" y="300" width="800" height="80" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="8"/>
  <text x="450" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">
    CI/CD Benefits
  </text>
  
  <text x="100" y="350" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Automated Testing</text>
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Faster Deployment</text>
  
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Consistent Builds</text>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Reduced Errors</text>
  
  <text x="500" y="350" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Team Collaboration</text>
  <text x="500" y="365" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Continuous Feedback</text>
  
  <text x="700" y="350" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Scalable Process</text>
  <text x="700" y="365" font-family="Arial, sans-serif" font-size="12" fill="#374151">• Quality Assurance</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>
</svg>
